name: Sync current SDK docs

on:
  push:
    branches:
      - docs/sdk-0.1.7-current

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sdk-0.1.7-current
          fetch-depth: 0

      - name: Sync current public package references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": [
                  ("interai-risk-oracle@0.1.6-beta", "interai-risk-oracle@0.1.7-beta"),
                  ("interai-risk-oracle==0.1.6b0", "interai-risk-oracle==0.1.7b0"),
                  ("https://pypi.org/project/interai-risk-oracle/0.1.6b0/", "https://pypi.org/project/interai-risk-oracle/0.1.7b0/"),
              ],
              "distribution/registry-submission.md": [
                  ("interai-risk-oracle@0.1.6-beta", "interai-risk-oracle@0.1.7-beta"),
                  ("interai-risk-oracle==0.1.6b0", "interai-risk-oracle==0.1.7b0"),
              ],
              "examples/framework-integrations/openai-agents/package.json": [
                  ('"interai-risk-oracle": "0.1.4-beta"', '"interai-risk-oracle": "0.1.7-beta"'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected current-reference token not found in {filename}: {old}")
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"No change made to {filename}")
              path.write_text(text)
          PY

          git rm .github/workflows/sync-current-sdk-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md distribution/registry-submission.md examples/framework-integrations/openai-agents/package.json
          git commit -m "docs: make SDK 0.1.7 the current public release"
          git push origin HEAD:docs/sdk-0.1.7-current
