name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish server metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry metadata
        run: ./mcp-publisher publish server.json
