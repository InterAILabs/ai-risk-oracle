name: Publish TypeScript SDK to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish interai-risk-oracle
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/interai-risk-oracle
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Confirm requested version
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - name: Type-check package
        run: npm run typecheck
      - name: Publish with provenance
        run: npm publish --access public --provenance
