name: Publish TypeScript SDK to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish interai-risk-oracle
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/interai-risk-oracle
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require main
        working-directory: .
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Package publishing must be dispatched from main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.15.0
      - name: Install dependencies
        run: npm ci
      - name: Confirm requested version
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - name: Refuse an already-published version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          const version = process.env.REQUESTED_VERSION;
          const url = `https://registry.npmjs.org/interai-risk-oracle/${encodeURIComponent(version)}`;
          const response = await fetch(url);
          if (response.status === 404) process.exit(0);
          if (!response.ok) throw new Error(`npm registry preflight failed: HTTP ${response.status}`);
          throw new Error(`interai-risk-oracle ${version} already exists on npm; bump the package version before publishing.`);
          NODE
      - name: Type-check package
        run: npm run typecheck
      - name: Publish beta with provenance
        run: npm publish --access public --tag beta
