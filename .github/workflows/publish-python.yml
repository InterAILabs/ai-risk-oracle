name: Publish Python SDK to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact pyproject.toml version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish interai-risk-oracle
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/interai-risk-oracle/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Package publishing must be dispatched from main."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Confirm requested version
        shell: python
        run: |
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())["project"]["version"]
          expected = "${{ inputs.version }}"
          if version != expected:
              raise SystemExit(f"Requested {expected}, but pyproject.toml contains {version}")
      - name: Refuse an already-published version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: python
        run: |
          import os
          import urllib.error
          import urllib.request

          version = os.environ["REQUESTED_VERSION"]
          url = f"https://pypi.org/pypi/interai-risk-oracle/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=15):
                  pass
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(0)
              raise

          raise SystemExit(
              f"interai-risk-oracle {version} already exists on PyPI; bump the package version before publishing."
          )
      - name: Build distributions
        run: python -m build --outdir dist python
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
