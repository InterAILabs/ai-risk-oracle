name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdk-contracts:
    name: SDK contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type-check TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: TypeScript builder contract
        run: node tests/sdk-builder-contract.mjs

      - name: Execution boundary contract
        run: node --test tests/execution-boundary.test.mjs

      - name: Inspect npm package contents
        working-directory: sdk/typescript
        run: npm pack --dry-run

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python SDK
        run: python -m compileall -q python tests/python-sdk-builder-contract.py

      - name: Python builder contract
        env:
          PYTHONPATH: python
        run: python tests/python-sdk-builder-contract.py

      - name: Build Python package
        run: |
          python -m pip install --upgrade build
          python -m build --outdir /tmp/interai-python-dist python
