name: CrewAI adapter check

on:
  push:
    branches:
      - "feat/crewai-fail-closed-adapter"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install "crewai==1.15.21" requests pytest
      - name: Run CrewAI adapter tests
        working-directory: examples/framework-integrations/crewai
        run: pytest -q test_interai_hook.py
