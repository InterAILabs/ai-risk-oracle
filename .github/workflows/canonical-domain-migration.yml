name: Canonical API domain migration

on:
  push:
    branches:
      - ops/canonical-api-domain-20260915

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ops/canonical-api-domain-20260915
          fetch-depth: 0

      - name: Replace legacy public hostname everywhere tracked
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = b"ai-risk-oracle.fly.dev"
          new = b"api.interailabs.dev"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              data = path.read_bytes()
              if old not in data:
                  continue
              path.write_bytes(data.replace(old, new))
              changed.append(str(path))
          print(f"replaced hostname in {len(changed)} tracked files")
          for path in changed:
              print(path)
          PY

      - name: Remove one-shot migration workflow
        run: rm .github/workflows/canonical-domain-migration.yml

      - name: Verify no public legacy hostname remains
        shell: bash
        run: |
          if git grep -n 'ai-risk-oracle\.fly\.dev'; then
            echo 'legacy Fly hostname still present in tracked public files'
            exit 1
          fi
          git diff --check

      - name: Commit migration as one branch commit
        shell: bash
        run: |
          git config user.name "InterAILabs"
          git config user.email "interailabs@gmail.com"
          git add -A
          git commit -m "docs: migrate canonical public API hostname"
          git push origin HEAD:ops/canonical-api-domain-20260915
